[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakemon-forge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mistralai>=1.0.0",
    # Floor set by the kohya LoRA shim in sprites.py: `lora_state_dict(...,
    # return_lora_metadata=True)` only returns the (state_dict, alphas, metadata)
    # 3-tuple the shim unpacks from 0.35 on. Older releases return a 2-tuple, so
    # loading dies in the unpack and the CLI reports a bare "failed to load
    # model". Developed and exercised against 0.38.
    "diffusers>=0.35.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "Pillow>=10.0.0",
    "torch>=2.2.0",
]

[project.scripts]
fakemon-forge = "fakemon_forge.main:main"

# The layout is flat, so auto-discovery sees fakemon_forge alongside tests/,
# resources/, models/ and output/ and refuses to guess. Only the package ships.
#
# Note that `resources/` sits *outside* the package and is located relative to
# the repo root (see `_RESOURCES` in generator.py / export_ini.py), so this
# project expects an editable install — `pip install -e .`. A regular install
# would place fakemon_forge in site-packages with no gen3_*.json beside it.
[tool.setuptools]
packages = ["fakemon_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: needs the real torch/diffusers stack importable (auto-skipped when torch is missing)",
]
